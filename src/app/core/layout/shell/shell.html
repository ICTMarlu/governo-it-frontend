<a class="skip-link" href="#main-content">Vai al contenuto</a>

<mat-toolbar class="toolbar">
  @if (!isDesktop()) {
    <button
      mat-icon-button
      type="button"
      aria-label="Apri il menu di navigazione"
      [attr.aria-expanded]="sidenav.opened"
      aria-controls="main-navigation"
      (click)="sidenav.toggle()"
    >
      <mat-icon aria-hidden="true">menu</mat-icon>
    </button>
  }

  <a class="brand" routerLink="/home">Governo IT</a>

  <span class="spacer"></span>

  @if (currentUser(); as user) {
    <span class="user">
      <span class="user__name">{{ user.displayName }}</span>
      <span class="user__role">{{ user.roleLabel }}</span>
    </span>
  }

  <button
    mat-icon-button
    type="button"
    aria-label="Cambia password"
    matTooltip="Cambia password"
    (click)="changePassword()"
  >
    <mat-icon aria-hidden="true">key</mat-icon>
  </button>

  <button mat-icon-button type="button" aria-label="Esci" matTooltip="Esci" (click)="logout()">
    <mat-icon aria-hidden="true">logout</mat-icon>
  </button>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav
    #sidenav
    id="main-navigation"
    class="sidenav"
    [mode]="isDesktop() ? 'side' : 'over'"
    [opened]="isDesktop()"
    [fixedInViewport]="!isDesktop()"
    fixedTopGap="56"
  >
    <nav aria-label="Navigazione principale">
      <mat-nav-list>
        @for (item of navItems(); track item.route) {
          <a
            mat-list-item
            [routerLink]="item.route"
            routerLinkActive="active"
            #link="routerLinkActive"
            [attr.aria-current]="link.isActive ? 'page' : null"
            (click)="onNavigate(sidenav)"
          >
            <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <main id="main-content" class="content" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

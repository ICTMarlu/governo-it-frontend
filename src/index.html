<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Governo IT</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Tema chiaro/scuro scelto dall'utente, applicato prima dell'avvio (niente lampo bianco) -->
    <script>
      try {
        var theme = localStorage.getItem('governo-it.theme');
        document.documentElement.style.colorScheme =
          theme === 'dark' ? 'dark' : theme === 'system' ? 'light dark' : 'light';
      } catch (e) {}
    </script>
    <!-- Logo Marlù: SVG nitido a ogni dimensione, PNG per i browser che non leggono l'SVG -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
  </head>
  <body>
    <gov-root></gov-root>
  </body>
</html>
